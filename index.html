<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workly | Solicitud IRTRA</title><style>
:root{--lime:#d6f458;--ink:#18222b;--muted:#66727d;--line:#e4e9ed;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif}.top{height:7px;background:var(--lime)}main{max-width:720px;margin:35px auto;padding:0 16px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:26px;font-weight:850;letter-spacing:-1px}.logo span{background:transparent;padding:0;border-radius:0;color:inherit}.tag{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,40px);min-height:470px;box-shadow:0 12px 35px #17212b0c;display:flex;flex-direction:column}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}.track{height:6px;background:#edf0e7;border-radius:20px;margin:12px 0 32px;overflow:hidden}.fill{height:100%;background:var(--lime);width:0}h1{font-size:clamp(27px,5vw,37px);line-height:1.15;letter-spacing:-1px;margin:0 0 12px}p{color:var(--muted);margin:0 0 24px}.field{width:100%;padding:15px;border:1px solid #d7dfe5;border-radius:11px;font:inherit}.options{display:grid;gap:11px}.option{padding:15px;border:1px solid var(--line);border-radius:12px;display:flex;gap:12px;align-items:center;cursor:pointer}.option:has(input:checked){border-color:#9bb92d;background:#fbfdec}input[type=radio],input[type=checkbox]{accent-color:#718a16}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:auto;padding-top:30px}.btn{border:0;border-radius:11px;padding:14px 20px;font:700 15px system-ui;cursor:pointer}.primary{background:var(--lime);color:#26320a}.secondary{background:#eef1f3;color:#34404a}.btn:disabled{opacity:.4}.note{background:#f8faef;border:1px solid #e7edcf;padding:14px;border-radius:11px;color:#4c5831}.error{color:#b42318;font-size:13px;min-height:20px}canvas{width:100%;height:160px;border:1px dashed #aeb9c1;border-radius:11px;touch-action:none}.preview{max-width:180px;max-height:180px;object-fit:cover;border-radius:10px;margin-top:12px}.hidden{display:none!important}.success{text-align:center;margin:auto}.mark{width:65px;height:65px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 20px;font-size:30px}footer{text-align:center;color:#89939c;font-size:12px;margin:18px}@media(max-width:520px){main{margin:18px auto}.card{min-height:560px}}</style></head><body><div class="top"></div><main><header class="brand"><div class="logo">workly<span>.</span></div><div class="tag">SOLICITUD IRTRA</div></header><section class="card"><div class="meta"><span id="label">BIENVENIDA</span><span id="count">INICIO</span></div><div class="track"><div class="fill" id="progress"></div></div><div id="content"></div><div class="error" id="error"></div><div class="actions" id="actions"><button class="btn secondary" id="back">Anterior</button><button class="btn primary" id="next">Comenzar</button></div></section><footer>Workly · Gestión de solicitudes de carné IRTRA</footer></main><script>
const S=[
['BIENVENIDA','Solicitud de carné IRTRA','Completa este formulario para iniciar tu trámite. Ten a mano la información necesaria y una fotografía reciente tipo cédula.','welcome'],
['DATOS PERSONALES','Nombre completo','Escribe tu nombre y apellido tal como deben aparecer en la solicitud.','fullname'],
['TIPO DE TRÁMITE','¿Qué trámite necesitas realizar?','Selecciona una opción.','radio','type',['Inscripción','Renovación','Reposición · Q25.00']],
['DATOS DEL CÓNYUGE','¿Deseas que los datos de tu cónyuge aparezcan en el carné?','Selecciona Sí o No.','radio','spouse',['Sí','No']],
['DATOS DEL CÓNYUGE','¿Cuál es el nombre de tu cónyuge?','Completa este campo si seleccionaste Sí.','text','spouseName','Nombre completo','conditional'],
['FIRMA','Firma dentro del recuadro','Dibuja tu firma con el dedo, lápiz táctil o mouse.','signature'],
['FOTOGRAFÍA','Prepara tu fotografía','Utiliza una fotografía reciente tipo cédula, con el rostro visible y fondo blanco o claro.','info'],
['FOTOGRAFÍA','Carga tu fotografía','Selecciona una imagen JPG o PNG.','file'],
['CONFIRMACIÓN','Confirma los requisitos','Confirma que tu fotografía cumple con las indicaciones.','check'],
['FINALIZAR','Revisa tu solicitud','Verifica la información antes de finalizar la prueba.','review']
];
let i=0,d={};const $=id=>document.getElementById(id),content=$('content');
function list(){return S.filter(x=>!(x[7]==='conditional'&&d.spouse!=='Sí'))}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){let a=list(),s=a[i];$('label').textContent=s[0];$('count').textContent=i?`${i} / ${a.length-1}`:'INICIO';$('progress').style.width=(i/(a.length-1)*100)+'%';$('error').textContent='';let h=`<h1>${s[1]}</h1><p>${s[2]}</p>`;
if(s[3]==='welcome')h+='<div class="note">Completar el formulario no significa que el carné ya esté emitido.</div>';
if(s[3]==='text' && s[3]!=='fullname')h+=`<input class="field" id="ans" placeholder="${s[5]}" value="${esc(d[s[4]])}">`;
if(s[3]==='fullname')h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label style="display:grid;gap:7px;font-size:14px;color:var(--muted)">Nombre<input class="field" id="firstName" placeholder="Nombre" value="${esc(d.firstName)}"></label><label style="display:grid;gap:7px;font-size:14px;color:var(--muted)">Apellido<input class="field" id="lastName" placeholder="Apellido" value="${esc(d.lastName)}"></label></div>`;

if(s[3]==='radio')h+=`<div class="options">${s[5].map(v=>`<label class="option"><input type="radio" name="ans" value="${v}" ${d[s[4]]===v?'checked':''}>${v}</label>`).join('')}</div>`;
if(s[3]==='signature')h+='<canvas id="sig" width="900" height="320"></canvas><p style="font-size:12px;margin-top:8px">Firma con tinta negra o azul.</p><button id="clear" class="btn secondary" type="button">Limpiar firma</button>';
if(s[3]==='info')h+='<div class="note">• Fotografía reciente tipo cédula.<br>• Rostro visible y centrado.<br>• Fondo blanco o claro.<br>• Sin accesorios que oculten el rostro.</div>';
if(s[3]==='file')h+='<input class="field" id="photo" type="file" accept="image/jpeg,image/png"><img id="preview" class="preview '+(d.photoUrl?'':'hidden')+'" src="'+(d.photoUrl||'')+'">';
if(s[3]==='check')h=`<label class="option"><input id="confirm" type="checkbox" ${d.confirm?'checked':''}>Confirmo que mi fotografía cumple los requisitos indicados.</label>`;
if(s[3]==='review')h=`<div class="note"><b>Nombre:</b> ${esc(d.firstName)}<br><b>Apellido:</b> ${esc(d.lastName)}<br><b>Trámite:</b> ${esc(d.type)}<br><b>¿Incluir cónyuge?:</b> ${esc(d.spouse)}<br><b>Cónyuge:</b> ${esc(d.spouseName||'No indicado')}<br><b>Firma:</b> ${d.signature?'Registrada':'Pendiente'}<br><b>Fotografía:</b> ${esc(d.photoName||'Pendiente')}</div><p class="note" style="margin-top:14px">Prototipo: todavía no transmite ni guarda solicitudes en un servidor.</p>`;
content.innerHTML=h;$('back').disabled=i===0;$('back').style.visibility=i===0?'hidden':'visible';$('next').textContent=s[3]==='welcome'?'Comenzar':s[3]==='review'?'Finalizar prueba':'Continuar';
if(s[3]==='signature')sigSetup();if(s[3]==='file')$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png'].includes(f.type))return $('error').textContent='Solo JPG o PNG.';d.photoName=f.name;let r=new FileReader();r.onload=()=>{d.photoUrl=r.result;$('preview').src=r.result;$('preview').classList.remove('hidden')};r.readAsDataURL(f)}
}
function sigSetup(){let c=$('sig'),ctx=c.getContext('2d'),on=false;ctx.lineWidth=5;ctx.lineCap='round';c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);let r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height)};c.onpointermove=e=>{if(!on)return;let r=c.getBoundingClientRect();ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);ctx.stroke()};c.onpointerup=()=>{on=false;d.signature=c.toDataURL()};$('clear').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);d.signature=''}}
function save(){let s=list()[i];if(s[3]==='text'){d[s[4]]=$('ans').value.trim();if(!d[s[4]])return 'Este campo es obligatorio.'}
if(s[3]==='fullname'){d.firstName=$('firstName').value.trim();d.lastName=$('lastName').value.trim();if(!d.firstName||!d.lastName)return 'Completa tu nombre y apellido.'}
if(s[3]==='radio'){d[s[4]]=document.querySelector('input[name=ans]:checked')?.value||'';if(!d[s[4]])return 'Selecciona una opción.';if(s[4]==='spouse'&&d.spouse==='No')d.spouseName=''}if(s[3]==='signature'&&!d.signature)return 'Debes registrar tu firma.';if(s[3]==='file'&&!d.photoName)return 'Debes cargar una fotografía.';if(s[3]==='check'){d.confirm=$('confirm').checked;if(!d.confirm)return 'Debes confirmar los requisitos.'}return ''}
$('back').onclick=()=>{if(i>0){save();i--;draw()}};$('next').onclick=()=>{let s=list()[i];if(!['welcome','info','review'].includes(s[3])){let e=save();if(e)return $('error').textContent=e}if(s[3]==='review'){content.innerHTML='<div class="success"><div class="mark">✓</div><h1>Prueba completada</h1><p>Este formulario es una demostración. No se envió ni guardó ninguna solicitud real.</p></div>';$('actions').classList.add('hidden');$('progress').style.width='100%';return}i++;draw()};draw();
</script></body></html>
